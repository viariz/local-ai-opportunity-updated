<style>
@font-face{
  font-family:"ABC Diatype Rounded";
  src:url("fonts/ABCDiatypeRounded-Light.woff2") format("woff2");
  font-weight:300;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"ABC Diatype Rounded";
  src:url("fonts/ABCDiatypeRounded-Regular.woff2") format("woff2");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"Truffle Sans";
  src:url("fonts/TruffleSans.ttf") format("truetype");
  font-weight:1 1000;
  font-stretch:100%;
  font-style:normal;
  font-display:swap;
}
/* Layout: a single long reading page — centered 38em measure, fixed left timeline rail that fills as you scroll. */
:root{
  --paper:#F4F4F4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#e34948;
  --ink:#1F2122;
  --ink-soft:#5c6164;
  --rule:rgba(31,33,34,.28);
  --wash:rgba(31,33,34,.06);
  --sans:"ABC Diatype Rounded","Helvetica Neue",Arial,sans-serif;
  --display:"Truffle Sans","ABC Diatype Rounded",sans-serif;
  color-scheme:light;
}

html{background:var(--paper); scrollbar-gutter:stable both-edges;}

/* Leave breathing room when following contents or section links. */
html{scroll-padding-top:clamp(40px,5vh,64px);}
@media(max-width:999px){
  html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);}
}

body{
  margin:0;
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-weight:300; font-synthesis:weight; font-size:16px; line-height:1.7;
  padding-left:max(40px, env(safe-area-inset-left, 0px));
  padding-right:max(40px, env(safe-area-inset-right, 0px));
  padding-block:0;
  -webkit-font-smoothing:antialiased;
}
.book{max-width:44em; margin:0 auto;}
.legacy-anchor{display:block; height:0;}
p{margin:0 0 1em; text-align:left;}
a{color:inherit; text-decoration:none;}
.prose a{text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px; text-decoration-color:var(--ink-soft);}
.sc{text-transform:uppercase; letter-spacing:.14em; font-size:.82em; font-weight:300;}
em{font-style:italic;font-synthesis:weight style;}
strong, b{font-weight:400;}
sup.fn{font-size:.6em; line-height:0; vertical-align:super;}
sup.fn a{text-decoration:none; color:var(--ink-soft); font-weight:300;}

/* ---- left rail ---- */
#rail{
  position:fixed; left:max(22px, env(safe-area-inset-left, 0px)); top:50%;
  transform:translateY(-50%); z-index:8;
  width:44px; padding:12px 0;
  opacity:0; pointer-events:none; transition:opacity .15s ease;
}
#rail.show{opacity:1; pointer-events:auto;}
#rail ol{list-style:none; margin:0; padding:0; position:relative;}
#rail li{
  position:relative; height:13px; margin:0; padding:0;
  font-size:12px; line-height:1.4; font-weight:300; white-space:nowrap;
  color:var(--ink-soft);
}
#rail .rail-track{position:absolute;left:0;overflow:visible;pointer-events:none;}
#rail .rail-track path{fill:none;vector-effect:non-scaling-stroke;}
#rail .dot{display:none;}
#rail li a, #rail li > .rail-label{
  display:block; width:44px; height:13px; color:inherit; text-decoration:none;
}
#rail .rail-title{
  position:absolute; left:52px; top:50%; padding:8px 12px;
  background:rgba(255,255,255,.5); border:1px solid rgba(31,33,34,.08); border-radius:999px;
  box-shadow:0 4px 20px rgba(31,33,34,.08), 0 1px 3px rgba(31,33,34,.04);
  color:#1F2122; font-size:12px; line-height:1.35; font-weight:300;
  opacity:0; visibility:hidden; pointer-events:none;
  transform:translate(4px,-50%) scale(.98); transform-origin:left center;
  transition:opacity .12s ease, transform .18s cubic-bezier(.2,.8,.2,1), visibility 0s linear .18s;
}
#rail li.preview .rail-title, #rail:not(.is-previewing) li:hover .rail-title, #rail li:has(a:focus-visible) .rail-title{
  opacity:1; visibility:visible; pointer-events:auto;
  transform:translate(0,-50%) scale(1);
  transition:opacity .12s ease, transform .18s cubic-bezier(.2,.8,.2,1), visibility 0s;
}
#rail:has(a:focus-visible) li.preview:not(:has(a:focus-visible)) .rail-title{
  opacity:0; visibility:hidden; pointer-events:none;
}
#rail li.here .rail-title{font-weight:400;}
#rail li.soon .rail-title{color:var(--ink-soft);}
#rail li a::before{content:"";position:absolute;left:-8px;top:0;width:calc(100% + 8px);height:100%;}
#rail li a:focus-visible{outline:none;}
@media (prefers-reduced-motion: reduce){
  #rail, #rail li::before, #rail .rail-tick, #rail .rail-title{transition:none!important;}
}
@media (max-width:999px){ #rail{display:none;} }

/* ---- top bar (narrow screens) ---- */
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--paper);}
#topbar{
  position:fixed; top:env(safe-area-inset-top, 0px); left:0; right:0; z-index:9;
  background:var(--paper);
  border-bottom:1px solid var(--rule);
  font-size:14px;
  padding-left:max(40px, env(safe-area-inset-left, 0px));
  padding-right:max(40px, env(safe-area-inset-right, 0px));
  opacity:0; pointer-events:none; transition:opacity .25s ease;
}
@media (prefers-reduced-motion: reduce){ #topbar{transition:none;} }
#topbar.show{opacity:1; pointer-events:auto;}
@media (min-width:1000px){ #topbar{display:none;} }
#topbar .inner{max-width:44em; margin:0 auto; display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding-block:9px;}
#topbar .where{color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; text-transform:uppercase; letter-spacing:.12em;}
#topbar .toc-link{text-transform:uppercase; letter-spacing:.1em; font-size:11px; font-weight:300; color:var(--ink-soft); white-space:nowrap;}

/* ---- interactive hovers ---- */
@media (hover:hover){
  #topbar .toc-link{transition:color .2s ease;}
  #topbar .toc-link:hover{color:var(--ink);}
  .titlepage .eyebrow a{transition:color .2s ease;}
  .titlepage .eyebrow a:hover{color:var(--ink);}
  .readline a{transition:color .2s ease, border-color .2s ease;}
  .readline a:hover{color:var(--ink); border-bottom-color:var(--ink);}
  .captabs button{transition:color .2s ease, border-color .2s ease;}
  .captabs button:hover:not(.active){color:var(--ink);}
  .prose a{transition:text-decoration-color .2s ease, color .2s ease;}
  .prose a:hover{text-decoration-color:var(--ink); color:var(--ink);}
}
@media (prefers-reduced-motion: reduce){
  #topbar .toc-link, .titlepage .eyebrow a, .readline a, .captabs button, .prose a{transition:none;}
}

/* ---- title page ---- */
.titlepage{box-sizing:border-box; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding-block:8vh;}
.titlepage .eyebrow{text-transform:uppercase; letter-spacing:.26em; font-size:13px; font-weight:300; color:var(--ink-soft); margin:0 0 1.35em;}
.titlepage .eyebrow a{text-decoration:none; color:inherit;}
.titlepage .eyebrow + h1{margin-top:0;}
.titlepage h1{font-family:var(--display);font-weight:300;font-variation-settings:"wght" 210;font-synthesis:none;font-size:clamp(1.55em,3.6vw,2.05em);line-height:1.22;letter-spacing:.04em;text-transform:none;margin:.15em 0 0;white-space:nowrap;text-wrap:nowrap;}

.thesis{margin-top:1.35em; max-width:34em; font-size:1.02em; line-height:1.6; color:var(--ink-soft); text-align:center; text-wrap:balance;}
.titlepage h1+.thesis{margin-top:12px;}
.thesis em{font-style:normal; font-weight:300; color:var(--ink);}
.byline{margin-top:3.4em; line-height:1.45;}
.byline .names{font-weight:300; letter-spacing:.01em;}
.byline .mail{font-size:.78em; color:var(--ink-soft);}
.dateline{margin-top:1.6em; font-size:.9em; color:var(--ink-soft);}
.readline{margin-top:4.2em;}
.readline a{text-transform:uppercase; letter-spacing:.22em; font-size:12px; font-weight:300; border-bottom:1px solid var(--rule); padding-bottom:3px;}

/* ---- chapters ---- */
.part{margin-top:7em;}
.part header{text-align:center; margin-bottom:2.6em;}
.part header .kicker{text-transform:uppercase; letter-spacing:.24em; font-size:12px; font-weight:300; color:var(--ink-soft);}
.part header h2{font-weight:300; font-size:.82em; letter-spacing:.18em; text-transform:uppercase; line-height:1.35; margin:0; text-align:center; text-wrap:balance;}
.sect{margin-top:3.2em;}
.sect h4{font-weight:400; font-size:1.02em; letter-spacing:.03em; line-height:1.35; margin:0 0 1em; text-align:left; padding-top:1.5em; border-top:1px solid var(--rule);}
.sect > h4:first-child{margin-top:.4em;}
.part .sect:not(:first-of-type) > h4{margin-top:3.8em;}
.sect .prose > p.callline:first-child{font-weight:400; font-size:1.02em; letter-spacing:.03em; line-height:1.35; margin:0 0 1em; padding-top:1.5em; border-top:1px solid var(--rule);}
.part .sect:not(:first-of-type) .prose > p.callline:first-child{margin-top:3.8em;}
.sect.sect-display{margin:0;}
.sect.sect-display.sect-display-break{margin:22vh 0;}
.sect.sect-display + .sect{margin-top:0;}
.cutouts + .prose{margin-top:2.2em;}
.sect h4.display-title + .cutouts{margin-top:1.15em;}
figure.fig-chart{margin:3.2em 0 2.8em;}
figure.fig-chart figcaption{margin-top:1.05em; margin-bottom:1.6em;}
.part.part-lede{margin-top:3.2em;}
.part.part-lede > blockquote.bigquote:first-child{margin:0 0 10vh;}
.part.part-lede .sect.sect-display{margin-top:14vh;}
.sect.sect-display h4,.sect h4.display-title{font-weight:300; font-size:1.54em; letter-spacing:.015em; line-height:1.35; margin:1.15em 0; text-align:center; padding-top:0; border-top:none;}
.sect h4.display-title{margin-bottom:2.4em;}
.asterism{text-align:center; letter-spacing:1.1em; padding-left:1.1em; margin:2.6em 0; color:var(--ink-soft);}
.prose > p:last-child{margin-bottom:0;}


/* Give each divider the same space on both sides. */
#a-million-new-computers{--section-divider-gap:clamp(3rem,6vw,4.5rem);}
#a-million-new-computers > .sect{
  margin-top:var(--section-divider-gap);
  padding-top:var(--section-divider-gap);
  border-top:1px solid var(--rule);
}
#a-million-new-computers > .sect > h4{
  margin-top:0; padding-top:0; border-top:0;
}
#a-million-new-computers > .sect > .prose > :last-child{margin-bottom:0;}

/* ---- scrollytelling intro ---- */
.scrolly{display:grid; grid-template-columns:1fr 1.25fr; gap:2.5em; margin:2.5em 0 3em; align-items:start;}
.scrolly-steps{display:flex; flex-direction:column; min-width:0;}
.step{min-height:80vh; display:flex; flex-direction:column; justify-content:center; opacity:.3; transition:opacity .35s ease;}
.step .when{text-transform:uppercase; letter-spacing:.16em; font-size:11px; font-weight:300; color:var(--ink-soft); margin-bottom:.6em;}
.step p{margin:0;}
.step p + p{margin-top:.85em;}
.chat{margin:2.5em 0 3em; display:flex; flex-direction:column; gap:1.05em; font-size:.84em; line-height:1.45; --chat-stroke:color-mix(in srgb, var(--ink) 40%, transparent); --chat-fill:color-mix(in srgb, var(--ink) 4%, transparent); --chat-r:20px; --chat-pad-x:14px;}
.chat .msg{min-width:0; display:flex;}
.chat .msg.user{justify-content:flex-end; padding-left:1.25em;}
.chat .msg.bot{justify-content:flex-start; padding-right:1.25em;}
.chat .bubble-shell{display:inline-block; position:relative; max-width:min(100%, 32em); vertical-align:top;}
.chat .bubble{display:block; position:relative; min-width:0; padding:9px var(--chat-pad-x); box-sizing:border-box;}
.chat .bot .bubble{border:none; background:var(--chat-fill); border-radius:var(--chat-r) var(--chat-r) var(--chat-r) 4px;}
.chat .user .bubble-shell{padding-right:8px;}
.chat .user .bubble{position:relative; z-index:1; border:0.7px solid var(--chat-stroke); background:var(--paper); border-radius:var(--chat-r); border-bottom-right-radius:4px;}
.chat .user .user-bubble-tail{position:absolute; z-index:0; right:1px; bottom:0; width:12px; height:14px; pointer-events:none; overflow:visible;}
.chat .user .user-bubble-tail path{fill:var(--paper); stroke:none;}
.chat .bot{min-width:0; font-weight:400;}
.chat .trunc{display:inline-block; margin-left:.35em; padding:.12em .45em; border-radius:4px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.72em; font-style:normal; font-weight:400; letter-spacing:.05em; text-transform:lowercase; color:var(--ink-soft); background:color-mix(in srgb, var(--ink) 6%, transparent); border:0.7px solid color-mix(in srgb, var(--ink) 11%, transparent); vertical-align:.1em;}
.chat .tools{display:flex; flex-direction:column; gap:.28em; padding:0; margin:0; border:none; background:transparent;}
.chat .tc{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.82em; line-height:1.55; color:color-mix(in srgb, var(--ink) 70%, transparent); font-weight:400; min-width:0; overflow-wrap:break-word;}
.chat .tc b{color:var(--ink); font-weight:500;}
.chat .tc.res{color:var(--ink); margin-top:.15em; font-family:var(--sans); font-size:.88em; line-height:1.5;}
.chat .tc.res b{font-weight:400;}
.callline{font-weight:300; font-size:1.05em; letter-spacing:.01em; margin-block:1.1em;}
.bigquote{margin:2.1em 0; max-width:none; text-align:left; font-style:italic; font-size:1.02em; line-height:1.65; padding-left:1em; border-left:1px solid var(--ink);}
.bigquote .attr{display:block; margin-top:.8em; font-style:normal; font-size:.72em; text-transform:uppercase; letter-spacing:.16em; color:var(--ink-soft);}
.step.active{opacity:1;}
.scrolly-chart{position:sticky; top:14vh; height:72vh; display:flex; align-items:center; min-width:0;}
.scrolly-chart svg{width:100%; height:auto; max-height:100%;}
.marker{opacity:0; transition:opacity .4s ease;}
.marker.on{opacity:1;}
@media (prefers-reduced-motion: reduce){
  .step, .marker{transition:none;}
  .step{opacity:1;}
}
@media (max-width:700px){
  body{
    padding-left:max(18px, env(safe-area-inset-left, 0px));
    padding-right:max(18px, env(safe-area-inset-right, 0px));
  }
  #topbar{
    font-size:16px;
    padding-left:max(18px, env(safe-area-inset-left, 0px));
    padding-right:max(18px, env(safe-area-inset-right, 0px));
  }
  #topbar .toc-link{font-size:13px;}
  .step .when, .part header .kicker{font-size:13px;}
  .chat{font-size:1em;}
  .scrolly{display:block;}
  .scrolly-chart{position:sticky; top:calc(env(safe-area-inset-top, 0px) + 38px); height:auto; background:var(--paper); z-index:2; padding-block:6px; border-bottom:1px solid var(--rule);}
  .scrolly-chart svg{max-height:40vh; width:auto; max-width:100%; margin-inline:auto;}
  .step{min-height:55vh;}
}

/* ---- news cutouts ---- */
.cutouts{display:flex; flex-wrap:wrap; gap:1.2em; margin:2.2em 0; align-items:flex-start;}
.cutouts figure{margin:0; flex:1 1 240px; min-width:0;}
.cutouts img{width:100%; height:auto; display:block; border:none; outline:none;}
.cutouts figcaption{margin-top:.78em; font-size:.72em; color:var(--ink-soft); text-align:left; line-height:1.45;}

/* ---- figures ---- */
figure{margin:2.8em 0; padding:0; max-width:100%;}
.book figure:not(.arc-tl) img, .book figure:not(.arc-tl) video, img.quoteface, img.arc-tl-photo{border:none; outline:none; border-radius:12px; box-shadow:0 12px 40px rgba(31,33,34,.05), 0 4px 14px rgba(31,33,34,.025);}
.fig-motion{max-width:100%; filter:drop-shadow(0 12px 40px rgba(31,33,34,.05)) drop-shadow(0 4px 14px rgba(31,33,34,.024));}
.fig-payments{
  margin-inline:0;
  margin-top:0;
}
.fig-payments .pay-visual{
  max-width:min(100%,32em);
  margin-inline:auto;
}
.fig-payments .pay-stage{overflow:visible;}
.fig-payments .pay-tagline{
  margin:.45em 0 0;
  text-align:center;
  font-size:.72em;
  letter-spacing:.12em;
  line-height:1.45;
  color:var(--ink-soft);
  font-weight:300;
}
.fig-payments svg .pay-motion{fill:none;stroke:none;pointer-events:none;}
.fig-payments svg .pay-links{pointer-events:none;}
.fig-payments svg .pay-spoke{stroke:rgba(31,33,34,.16); stroke-width:.85; stroke-dasharray:4 5;}
.fig-payments svg .pay-ring{fill:none; stroke:rgba(31,33,34,.16); stroke-width:.85; stroke-dasharray:4 5;}
.fig-payments svg .pay-dots{pointer-events:none;}
.fig-payments svg .pay-dots .pay-dot-in{fill:url(#payDotFillIn);}
.fig-payments svg .pay-dots .pay-dot-out{fill:url(#payDotFillOut);}
.fig-payments svg .pay-glyph-name{font-family:var(--sans); font-size:8.5px; font-weight:400; fill:var(--ink);}
.fig-payments svg .pay-glyph-sub{font-family:var(--sans); font-size:7px; font-weight:300; fill:var(--ink-soft); font-variant-numeric:tabular-nums;}
.fig-payments svg .pay-glyph{transition:opacity .22s ease;}
.fig-payments svg .pay-dot{transition:none;}
.fig-payments.is-flow-focus svg .pay-links{opacity:.18; transition:opacity .22s ease;}
.fig-payments.is-flow-focus svg .pay-glyph{opacity:.2;}
.fig-payments.is-flow-focus svg .pay-glyph.is-flow-active{opacity:1;}
.fig-payments svg .pay-sector-hit{cursor:default; pointer-events:all;}
.fig-payments svg .pay-sector-inner{fill:none; stroke:#1F2122; stroke-opacity:.7; stroke-width:.8;}

.fig-payments .pay-sector-machine{pointer-events:none;}
.fig-payments .pay-hub-panel{fill:var(--paper);stroke:var(--ink);stroke-width:.8;}
.fig-payments .pay-fee-glow{fill:var(--s3);opacity:0;pointer-events:none;}
.fig-payments .pay-arbiter{fill:none;stroke:var(--ink);stroke-width:1;stroke-linecap:round;stroke-linejoin:round;}
.fig-payments .pay-hub-label{font-size:7px;letter-spacing:1px;fill:var(--ink-soft);}
.fig-payments .pay-fee-label{font-size:10px;font-weight:400;letter-spacing:.8px;fill:var(--ink);}
.fig-payments .pay-fee-total{font-size:8.5px;font-variant-numeric:tabular-nums;fill:var(--ink-soft);}
.fig-payments .pay-fee-receipt{font-size:8px;font-variant-numeric:tabular-nums;fill:var(--s3);opacity:0;}

.fig-payments .pay-hub-label,.fig-payments .pay-fee-label,.fig-payments .pay-fee-total,.fig-payments .pay-fee-receipt{paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round;}
.fig-payments figcaption{margin-top:3.7em;}
@media (prefers-reduced-motion: reduce){
  .fig-payments .pay-glyph{transform:none!important;}
}
.book figure:not(.arc-tl):has(> video){line-height:0; margin:0; overflow:visible; border-radius:0; box-shadow:none; background:transparent;}
.book figure:not(.arc-tl):has(> video) video{display:block; width:100%; max-width:100%; height:auto; margin:0; padding:0; border:0; border-radius:12px; box-shadow:none; background:var(--paper);}
.book figure.no-img-shadow img{border-radius:0; box-shadow:none;}
.book figure img, .book figure video{display:block; width:100%; max-width:100%; height:auto;}
figure svg{display:block; width:100%; height:auto;}

<script>
(function(){
  var topbar = document.getElementById('topbar');
  var where = document.getElementById('whereami');
  var readingRail = window.createReadingRail(document.getElementById('rail'));
  var sections = Array.prototype.slice.call(document.querySelectorAll('[data-title]'));
  var title = document.getElementById('top');
  function onScroll(){
    var y = window.scrollY || document.documentElement.scrollTop;
    var past = y > title.offsetHeight - 220;
    topbar.classList.toggle('show', past);
    var current = '';
    for (var i = 0; i < sections.length; i++) {
      if (sections[i].offsetTop - 140 <= y) current = sections[i].getAttribute('data-title');
    }
    where.textContent = current;
    readingRail.update();
    scrollyUpdate();
  }

  // scrollytelling: draw the token curve as the intro steps pass
  var scrolly = document.getElementById('scrolly');
  var tokcurve = document.getElementById('tokcurve');
  var chip = document.getElementById('stage-chip');
  var steps = scrolly ? Array.prototype.slice.call(scrolly.querySelectorAll('.step')) : [];
  var markers = scrolly ? Array.prototype.slice.call(scrolly.querySelectorAll('.marker')) : [];
  var chipText = ['2023', '2025', '2026–27', '2027½+'];
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var curveLen = 0, markerFrac = [];
  if (tokcurve) {
    curveLen = tokcurve.getTotalLength();
    markers.forEach(function(m){
      var mx = parseFloat(m.getAttribute('data-x'));
      var lo = 0, hi = curveLen;
      for (var k = 0; k < 24; k++) {
        var mid = (lo + hi) / 2;
        if (tokcurve.getPointAtLength(mid).x < mx) { lo = mid; } else { hi = mid; }
      }
      markerFrac.push(lo / curveLen);
    });
    if (!reduceMotion) {
      tokcurve.style.strokeDasharray = curveLen;
      tokcurve.style.strokeDashoffset = curveLen;
    } else {
      markers.forEach(function(m){ m.classList.add('on'); });
    }
  }
  function scrollyUpdate(){
    if (!scrolly || !tokcurve || steps.length < 2) return;
    var vh = window.innerHeight;
    var m = vh * 0.5;
    var centers = steps.map(function(st){
      var sr = st.getBoundingClientRect();
      return sr.top + sr.height / 2;
    });
    // s: continuous stage position; s = i exactly when step i is centered
    var s;
    if (m <= centers[0]) {
      s = (m - centers[0]) / (centers[1] - centers[0]);
    } else if (m >= centers[centers.length - 1]) {
      var n = centers.length - 1;
      s = n + (m - centers[n]) / (centers[n] - centers[n - 1]);
    } else {
      for (var i = 0; i < centers.length - 1; i++) {
        if (m >= centers[i] && m <= centers[i + 1]) {
          s = i + (m - centers[i]) / (centers[i + 1] - centers[i]);
          break;
        }
      }
    }
    s = Math.max(-0.9, Math.min(3.75, s));
    // piecewise map: stage position -> fraction of curve drawn
    var sa = [-0.9, 0, 1, 2, 3, 3.75];
    var fa = [0, markerFrac[0] || 0.05, markerFrac[1] || 0.4, markerFrac[2] || 0.72, markerFrac[3] || 0.88, 1];
    var p = fa[fa.length - 1];
    for (var k = 0; k < sa.length - 1; k++) {
      if (s <= sa[k + 1]) {
        p = fa[k] + (fa[k + 1] - fa[k]) * (s - sa[k]) / (sa[k + 1] - sa[k]);
        break;
      }
    }
    if (!reduceMotion) {
      tokcurve.style.strokeDashoffset = curveLen * (1 - p);
      for (var q = 0; q < markers.length; q++) {
        markers[q].classList.toggle('on', s >= q - 0.1);
      }
    }
    var activeIdx = Math.max(0, Math.min(steps.length - 1, Math.round(s)));
    for (var j = 0; j < steps.length; j++) steps[j].classList.remove('active');
    steps[activeIdx].classList.add('active');
    if (chip) chip.textContent = chipText[activeIdx] || chipText[0];
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', function(){ readingRail.measure(); onScroll(); });
  onScroll();
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.documentElement.style.scrollBehavior = 'smooth';
  }
})();
</script>
<script>
(function(){
  var svg = document.querySelector('.fig-payments svg');
  if (!svg) return;
  var fig = document.querySelector('.fig-payments');
  var layer = svg.querySelector('.pay-dots');
  var linksLayer = svg.querySelector('.pay-links');
  var pathRoot = svg.querySelector('#payPaths');
  if (!layer || !pathRoot || !linksLayer) return;
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var NS = 'http://www.w3.org/2000/svg';
  var HUB = { x: 360, y: 155 };
  var GLYPH_LINK_R = 16.5;
  var HUB_LINK_R = 24;
  var nodes = {
    legal: { x: 240, y: 155, r: 32 },
    research: { x: 297, y: 52, r: 32 },
    trading: { x: 423, y: 52, r: 32 },
    code: { x: 297, y: 255, r: 32 },
    design: { x: 423, y: 255, r: 32 },
    taxes: { x: 482, y: 155, r: 32 }
  };
  var inRoutes = { legal: [], research: [], trading: [] };
  var outRoutes = { code: [], design: [], taxes: [] };
  var particles = [];
  var maxLive = 110;
  var dotVis = 1.15;
  var sectorTotals = {};
  var feeTotal = 0;
  var feeTotalEl = svg.querySelector('.pay-fee-total');
  var feeReceipt = svg.querySelector('.pay-fee-receipt');
  var feeGlow = svg.querySelector('.pay-fee-glow');
  var lastFeePulse = -Infinity;
  var pendingReceipt = 0;
  var previousFrame = 0;

  function collectFee(amount) {
    var fee = Math.round(amount * .01 * 100) / 100;
    feeTotal += fee;
    pendingReceipt += fee;
    feeTotalEl.textContent = '$' + feeTotal.toFixed(2) + ' collected';
    feeTotalEl.setAttribute('data-collected', feeTotal.toFixed(2));
    var now = performance.now();
    if (now - lastFeePulse > 650) {
      lastFeePulse = now;
      feeReceipt.textContent = '+$' + pendingReceipt.toFixed(2);
      pendingReceipt = 0;
      feeGlow.animate([{opacity:0},{opacity:.2,offset:.2},{opacity:0}],{duration:650});
      feeReceipt.animate([{opacity:0,transform:'translateY(2px)'},{opacity:1,offset:.15},{opacity:0,transform:'translateY(-4px)'}],{duration:650});
    }
    return fee;
  }
  var subEls = {};
  svg.querySelectorAll('.pay-glyph-sub[data-sector]').forEach(function(el){
    var id = el.getAttribute('data-sector');
    sectorTotals[id] = 0;
    subEls[id] = el;
  });

  function rand(a, b){ return a + Math.random() * (b - a); }
  function pick(a){ return a[Math.floor(Math.random() * a.length)]; }

  function fmtDollar(abs){
    if (abs >= 1000000) return '$' + (abs / 1000000).toFixed(2).replace(/\.?0+$/, '') + 'M';
    if (abs >= 10000) return '$' + Math.round(abs / 1000) + 'K';
    if (abs >= 1000) return '$' + (abs / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
    return '$' + Math.round(abs);
  }

  function paintSectorSubs(){
    Object.keys(subEls).forEach(function(id){
      var el = subEls[id];
      var dir = el.getAttribute('data-flow-dir');
      var v = sectorTotals[id] || 0;
      el.textContent = fmtDollar(v);
    });
  }

  function rimToward(fx, fy, tx, ty, r){
    var dx = tx - fx;
    var dy = ty - fy;
    var d = Math.hypot(dx, dy) || 1;
    return { x: fx + (dx / d) * r, y: fy + (dy / d) * r };
  }

  function addLinkLine(x1, y1, x2, y2){
    var line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', x1.toFixed(2));
    line.setAttribute('y1', y1.toFixed(2));
    line.setAttribute('x2', x2.toFixed(2));
    line.setAttribute('y2', y2.toFixed(2));
    line.setAttribute('class', 'pay-spoke');
    linksLayer.appendChild(line);
  }

  function buildPayLinks(){
    var ringOrder = ['legal', 'research', 'trading', 'taxes', 'design', 'code'];
    for (var i = 0; i < ringOrder.length; i++) {
      var a = nodes[ringOrder[i]];
      var b = nodes[ringOrder[(i + 1) % ringOrder.length]];
      var s = rimToward(a.x, a.y, b.x, b.y, GLYPH_LINK_R);
      var e = rimToward(b.x, b.y, a.x, a.y, GLYPH_LINK_R);
      addLinkLine(s.x, s.y, e.x, e.y);
    }
    Object.keys(nodes).forEach(function(key){
      var n = nodes[key];
      var s = rimToward(HUB.x, HUB.y, n.x, n.y, HUB_LINK_R);
      var e = rimToward(n.x, n.y, HUB.x, HUB.y, GLYPH_LINK_R);
      addLinkLine(s.x, s.y, e.x, e.y);
    });
  }

  function rim(n, tx, ty){
    var dx = tx - n.x;
    var dy = ty - n.y;
    var d = Math.hypot(dx, dy) || 1;
    return { x: n.x + (dx / d) * n.r, y: n.y + (dy / d) * n.r };
  }

  function hubToward(nodeX, nodeY, lane){
    var dx = nodeX - HUB.x;
    var dy = nodeY - HUB.y;
    var d = Math.hypot(dx, dy) || 1;
    var px = -dy / d;
    var py = dx / d;
    var hr = HUB_LINK_R;
    return {
      x: HUB.x + (dx / d) * hr + px * lane * 5.5,
      y: HUB.y + (dy / d) * hr + py * lane * 5.5
    };
  }

  function addPath(d, bucket, flowId){
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    p.setAttribute('class', 'pay-motion');
    p.setAttribute('data-flow', flowId);
    pathRoot.appendChild(p);
    bucket.push(p);
  }

  function applyGlyphFocus(){
    var flow = window.__payActiveFlow;
    var glyphs = svg.querySelectorAll('.pay-glyph');
    for (var gi = 0; gi < glyphs.length; gi++) {
      var g = glyphs[gi];
      var sector = g.getAttribute('data-sector');
      g.classList.toggle('is-flow-active', !flow || sector === 'hub' || sector === flow);
    }
  }

  function particleFocusMul(p){
    var focus = window.__payActiveFlow;
    return !focus || p.flow === focus ? 1 : 0.14;
  }

  function particleFade(p){
    if (p.u < 0.06) return p.u / 0.06;
    if (p.u > 0.9) return (1 - p.u) / 0.1;
    return 1;
  }

  function applyParticleOpacity(p){
    var focus = window.__payActiveFlow;
    var on = !focus || p.flow === focus;
    p.el.classList.toggle('is-flow-active', on);
    p.el.setAttribute('opacity', Math.min(1, p.baseOpacity * particleFade(p) * particleFocusMul(p) * dotVis).toFixed(3));
  }

  function setFlowFocus(flow){
    window.__payActiveFlow = flow || null;
    if (fig) fig.classList.toggle('is-flow-focus', !!flow);
    applyGlyphFocus();
    for (var i = 0; i < particles.length; i++) applyParticleOpacity(particles[i]);
  }

  function buildRoutes(){
    var lanes = [-0.45, 0.45];
    lanes.forEach(function(lane){
      var bow = lane * 11;
      var s = rim(nodes.legal, HUB.x, HUB.y);
      var e = hubToward(nodes.legal.x, nodes.legal.y, lane);
      addPath('M' + s.x + ',' + s.y + ' Q' + (310 + bow) + ',' + (148 + lane * 5) + ' ' + e.x + ',' + e.y, inRoutes.legal, 'legal');

      s = rim(nodes.research, HUB.x, HUB.y);
      e = hubToward(nodes.research.x, nodes.research.y, lane);
      addPath('M' + s.x + ',' + s.y + ' Q' + (330 + bow * 0.7) + ',' + (95 + lane * 4) + ' ' + e.x + ',' + e.y, inRoutes.research, 'research');

      s = rim(nodes.trading, HUB.x, HUB.y);
      e = hubToward(nodes.trading.x, nodes.trading.y, lane);
      addPath('M' + s.x + ',' + s.y + ' Q' + (390 - bow * 0.7) + ',' + (95 - lane * 4) + ' ' + e.x + ',' + e.y, inRoutes.trading, 'trading');

      var o = hubToward(nodes.code.x, nodes.code.y, lane);
      s = rim(nodes.code, HUB.x, HUB.y);
      addPath('M' + o.x + ',' + o.y + ' Q' + (340 + bow) + ',' + (210 + lane * 6) + ' ' + s.x + ',' + s.y, outRoutes.code, 'code');

      s = rim(nodes.design, HUB.x, HUB.y);
      o = hubToward(nodes.design.x, nodes.design.y, lane);
      addPath('M' + o.x + ',' + o.y + ' Q' + (380 - bow) + ',' + (210 - lane * 6) + ' ' + s.x + ',' + s.y, outRoutes.design, 'design');

      o = hubToward(nodes.taxes.x, nodes.taxes.y, lane);
      s = rim(nodes.taxes, HUB.x, HUB.y);
      addPath('M' + o.x + ',' + o.y + ' Q' + (430 + bow * 0.5) + ',' + (155 + lane * 7) + ' ' + s.x + ',' + s.y, outRoutes.taxes, 'taxes');
    });
  }

  function frameAt(path, u){
    var len = path.getTotalLength();
    var pt = path.getPointAtLength(len * u);
    var pt2 = path.getPointAtLength(len * Math.min(u + 0.01, 1));
    var dx = pt2.x - pt.x;
    var dy = pt2.y - pt.y;
    var mag = Math.hypot(dx, dy) || 1;
    return { pt: pt, nx: -dy / mag, ny: dx / mag, tx: dx / mag, ty: dy / mag };
  }

  function spawnParticle(routeList, delay, dir, amount){
    setTimeout(function(){
      if (particles.length >= maxLive) return;
      var path = pick(routeList);
      var el = document.createElementNS(NS, 'ellipse');
      el.setAttribute('class', 'pay-dot pay-dot-' + dir);
      layer.appendChild(el);
      var dotR = rand(0.75, 1.35);
      el.setAttribute('rx', dotR.toFixed(2));
      el.setAttribute('ry', dotR.toFixed(2));
      var flow = path.getAttribute('data-flow');
      var particle = {
        el: el,
        path: path,
        flow: flow,
        dir: dir,
        amount: amount == null ? Math.round(rand(18, 420) * 100) / 100 : amount,
        u: 0,
        speed: rand(0.0022, 0.0036),
        lane: rand(-5, 5),
        laneVel: rand(-0.025, 0.025),
        swayA: rand(2.5, 7),
        swayB: rand(1.2, 4.5),
        phaseA: rand(0, Math.PI * 2),
        phaseB: rand(0, Math.PI * 2),
        baseOpacity: rand(0.52, 0.94),
        baseR: dotR
      };
      applyParticleOpacity(particle);
      particles.push(particle);
    }, delay);
  }

  function spawnGroup(routeList, dir){
    var n = pick([1, 1, 2, 2, 3]);
    for (var i = 0; i < n; i++) spawnParticle(routeList, i * rand(30, 140), dir);
  }

  function pump(routeList, dir){
    function spawnTick(){
      spawnGroup(routeList, dir);
      setTimeout(spawnTick, rand(700, 1400));
    }
    setTimeout(spawnTick, rand(0, 700));
  }

  function tick(now){
    var frameStep = previousFrame ? Math.min(64, now - previousFrame) / (1000 / 60) : 1;
    previousFrame = now;
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.u += p.speed * frameStep;
      p.lane += p.laneVel;
      p.lane *= 0.996;
      if (p.u >= 1) {
        sectorTotals[p.flow] = (sectorTotals[p.flow] || 0) + p.amount;
        if (p.dir === 'in') {
          var fee = collectFee(p.amount);
          var recipient = pick(Object.keys(outRoutes));
          spawnParticle(outRoutes[recipient], 0, 'out', p.amount - fee);
        }
        paintSectorSubs();
        layer.removeChild(p.el);
        particles.splice(i, 1);
        continue;
      }
      var fr = frameAt(p.path, p.u);
      var sway = Math.sin(p.u * p.swayA + p.phaseA) * 1.85 + Math.cos(p.u * p.swayB + p.phaseB) * 1.15;
      var lane = p.lane + sway;
      var px = fr.pt.x + fr.nx * lane;
      var py = fr.pt.y + fr.ny * lane;
      var fade = particleFade(p);
      var br = p.baseR;
      p.el.setAttribute('cx', px.toFixed(2));
      p.el.setAttribute('cy', py.toFixed(2));
      p.el.setAttribute('rx', br.toFixed(2));
      p.el.setAttribute('ry', br.toFixed(2));
      p.el.removeAttribute('transform');
      p.el.setAttribute('opacity', Math.min(1, p.baseOpacity * fade * particleFocusMul(p) * dotVis).toFixed(3));
    }
    requestAnimationFrame(tick);
  }

  window.__paySetSectorFocus = setFlowFocus;

  function syncSectorFocusFromPointer(e){
    var t = e.target;
    if (!t || !t.closest) {
      setFlowFocus(null);
      return;
    }
    var sectorEl = t.closest('.pay-glyph-sector');
    setFlowFocus(sectorEl ? sectorEl.getAttribute('data-sector') : null);
  }
  if (fig) {
    fig.addEventListener('mousemove', syncSectorFocusFromPointer);
    fig.addEventListener('mouseleave', function(){ setFlowFocus(null); });
  }

  buildPayLinks();
  buildRoutes();
  paintSectorSubs();
  if (reducedMotion) return;
  pump(inRoutes.legal, 'in');
  pump(inRoutes.research, 'in');
  pump(inRoutes.trading, 'in');
  requestAnimationFrame(tick);
})();
</script>
